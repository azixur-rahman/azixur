name: Build azixur CPH2185 CPH2179 (GPS FM BakaSU KSU-Next)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: azixur-kernel-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        flavor: [bakasu, ksun]
    name: build-${{ matrix.flavor }}

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex gcc-aarch64-linux-gnu \
            libelf-dev libncurses5-dev libssl-dev python3 zip

      - name: Integrate BakaSU (KernelSU + SUSFS)
        if: matrix.flavor == 'bakasu'
        run: |
          set -euo pipefail
          curl -LSs https://raw.githubusercontent.com/leonardrua/BakaSU/main/kernel/setup.sh \
            | bash -s main
          test -d KernelSU/kernel
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig
          echo 'BakaSU integrated'

      - name: Integrate KernelSU-Next (legacy branch, 4.9)
        if: matrix.flavor == 'ksun'
        run: |
          set -euo pipefail
          git clone --depth 1 -b legacy \
            https://github.com/KernelSU-Next/KernelSU-Next KernelSU-Next
          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/core/init.c
          echo 'KernelSU-Next integrated'

      - name: Enable GPS and FM radio built-in drivers
        run: python3 .github/scripts/patch_connectivity.py

      - name: Apply kernel configuration tweaks
        run: python3 .github/scripts/config_tweaks.py ${{ matrix.flavor }}

      - name: Confirm touch fix is present (stock DTBO is not touched)
        run: |
          if ! grep -q 'novatek,swrst-n8-addr' \
              arch/arm64/boot/dts/mediatek/oppo6765.dts; then
            git apply packaging/falcon-az-touch-fix.patch
          fi
          grep -n 'novatek,swrst-n8-addr' \
            arch/arm64/boot/dts/mediatek/oppo6765.dts

      - name: Build kernel and DTBs
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          ODM_WT_EDIT: "yes"
          VENDOR_EDIT: "1"
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CPH2185_defconfig
          make -j"$(nproc)" O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            AUTOCONF_H="$PWD/out/include/generated/autoconf.h" \
            Image.gz-dtb dtbs
          test -s out/arch/arm64/boot/Image.gz-dtb
          cp out/.config "azixur-${FLAVOR}-config"
          cp out/System.map "azixur-${FLAVOR}-System.map"
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Verify GPS, FM, root solution and RAM support
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -eux
          CFG="azixur-${FLAVOR}-config"
          MAP="azixur-${FLAVOR}-System.map"
          grep -q '^CONFIG_MTK_COMBO_GPS=y' "$CFG"
          grep -q '^CONFIG_MTK_FMRADIO=y' "$CFG"
          grep -q '^CONFIG_MTK_FM_CHIP="MT6631_FM"' "$CFG"
          grep -q '^CONFIG_KSU=y' "$CFG"
          grep -q '^CONFIG_KPROBES=y' "$CFG"
          grep -q '^CONFIG_TMPFS_XATTR=y' "$CFG"
          grep -q '^CONFIG_ZRAM=y' "$CFG"
          grep -E '^CONFIG_KSU|^CONFIG_MTK_COMBO_GPS|^CONFIG_MTK_FMRADIO' "$CFG"

          test -s out/drivers/misc/mediatek/connectivity/gps/gps_drv.o
          test -s out/drivers/misc/mediatek/connectivity/gps/stp_chrdev_gps.o
          test -s out/drivers/misc/mediatek/connectivity/gps/built-in.o
          test -s out/drivers/misc/mediatek/connectivity/fmradio/fmradio_drv.o
          test -s out/drivers/misc/mediatek/connectivity/fmradio/core/fm_module.o
          test -s out/drivers/misc/mediatek/connectivity/fmradio/built-in.o

          grep -q ' T mtk_wcn_stpgps_drv_init$' "$MAP"
          grep -q ' T mtk_wcn_fm_init$' "$MAP"
          test -n "$(find out/drivers -path '*kernelsu*' -name '*.o' -print -quit)"

      - name: Package AnyKernel zip
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb
          cp packaging/cph2185-anykernel.sh anykernel/anykernel.sh
          sed -i "s#^kernel.string=.*#kernel.string=azixur ${FLAVOR} Kernel (GPS+FMRadio) by Azixur Rahman#" \
            anykernel/anykernel.sh
          chmod +x anykernel/anykernel.sh
          grep -q '^do.devicecheck=0' anykernel/anykernel.sh
          test ! -e anykernel/dtbo.img
          rm -rf anykernel/.git
          cd anykernel
          zip -r9 "../azixur-${FLAVOR}-CPH2185-CPH2179-${GITHUB_SHA::12}.zip" . \
            -x README.md -x '*placeholder' -x '.git/*'
          cd ..
          sha256sum azixur-${FLAVOR}-CPH2185-CPH2179-*.zip

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azixur-${{ matrix.flavor }}-${{ github.sha }}
          path: |
            azixur-${{ matrix.flavor }}-CPH2185-CPH2179-*.zip
            azixur-${{ matrix.flavor }}-config
            azixur-${{ matrix.flavor }}-System.map
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download both AnyKernel zips
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: azixur-*
          merge-multiple: true

      - name: List release files
        run: ls -lh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "azixur-${{ github.run_number }}" dist/*.zip \
            --title "azixur CPH2185/CPH2179 build ${{ github.run_number }}" \
            --notes "MT6765 kernel 4.9.190-falcon-az for OPPO A15 (CPH2185) / A15s (CPH2179).

          Two flavors, flash only one:

          - **bakasu** - BakaSU KernelSU with SUSFS
          - **ksun** - KernelSU-Next legacy (syscall-table hook)

          Both include:

          - GPS built-in (oppo-source A15_Q)
          - FM radio built-in, MT6631 (oppo-source A15_Q)
          - zram + LZ4 (RAM compression)
          - deadline default I/O scheduler
          - NT36525B touch fix, stock DTBO partition untouched
          - AnyKernel3, kernel only: no boot.img, no vendor writes"
