name: Build azixur CPH2185 CPH2179 (GPS FM BakaSU KSU-Next)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: azixur-kernel-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        flavor: [bakasu, ksun]
    name: build-${{ matrix.flavor }}

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex gcc-aarch64-linux-gnu \
            libelf-dev libncurses5-dev libssl-dev python3 zip

      - name: Integrate BakaSU (KernelSU + SUSFS)
        if: matrix.flavor == 'bakasu'
        run: |
          set -euo pipefail
          curl -LSs https://raw.githubusercontent.com/leonardrua/BakaSU/main/kernel/setup.sh \
            | bash -s main
          test -d KernelSU/kernel
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig
          echo 'BakaSU integrated'

      - name: Integrate KernelSU-Next (legacy branch, 4.9)
        if: matrix.flavor == 'ksun'
        run: |
          set -euo pipefail
          git clone --depth 1 -b legacy \
            https://github.com/KernelSU-Next/KernelSU-Next KernelSU-Next
          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/core/init.c
          echo 'KernelSU-Next integrated'

      - name: Adapt KernelSU-Next syscall hook to the 4.9 arm64 ABI
        if: matrix.flavor == 'ksun'
        run: python3 .github/scripts/patch_ksun.py

      - name: Configure GPS/FM built-in drivers (disabled for WiFi/BT safety)
        env:
          AZIXUR_ENABLE_GPS_FM: "0"
        run: python3 .github/scripts/patch_connectivity.py

      - name: Apply kernel configuration tweaks
        run: python3 .github/scripts/config_tweaks.py ${{ matrix.flavor }}

      - name: Confirm touch fix is present (stock DTBO is not touched)
        run: |
          if ! grep -q 'novatek,swrst-n8-addr' \
              arch/arm64/boot/dts/mediatek/oppo6765.dts; then
            git apply packaging/falcon-az-touch-fix.patch
          fi
          grep -n 'novatek,swrst-n8-addr' \
            arch/arm64/boot/dts/mediatek/oppo6765.dts

      - name: Build kernel and DTBs
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          ODM_WT_EDIT: "yes"
          VENDOR_EDIT: "1"
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CPH2185_defconfig
          make -j"$(nproc)" O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            AUTOCONF_H="$PWD/out/include/generated/autoconf.h" \
            Image.gz Image.gz-dtb dtbs
          test -s out/arch/arm64/boot/Image.gz
          test -s out/arch/arm64/boot/Image.gz-dtb
          cp out/.config "azixur-${FLAVOR}-config"
          cp out/System.map "azixur-${FLAVOR}-System.map"
          ls -lh out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image.gz-dtb

      - name: Verify connectivity, root solution and RAM support
        env:
          FLAVOR: ${{ matrix.flavor }}
          AZIXUR_ENABLE_GPS_FM: "0"
        run: |
          set -eux
          CFG="azixur-${FLAVOR}-config"
          MAP="azixur-${FLAVOR}-System.map"
          grep -q '^CONFIG_KSU=y' "$CFG"
          grep -q '^CONFIG_KPROBES=y' "$CFG"
          grep -q '^CONFIG_TMPFS_XATTR=y' "$CFG"
          grep -q '^CONFIG_ZRAM=y' "$CFG"
          grep -q '^CONFIG_SND_ALOOP=y' "$CFG"
          grep -q '^CONFIG_SND_VIRMIDI=y' "$CFG"
          grep -q '^CONFIG_SND_DUMMY=y' "$CFG"
          grep -q '^# CONFIG_PANIC_ON_OOPS is not set' "$CFG"
          grep -q '^CONFIG_PANIC_ON_OOPS_VALUE=0' "$CFG"
          # A bad out-of-tree module oops must only kill the caller, never
          # reset the phone: lock the sysctl and bypass mrdump's die notifier.
          grep -q 'panic_on_oops locked to 0' kernel/sysctl.c
          grep -q 'azixur: oops ignored, panic_on_oops=0 (no reboot)' \
            drivers/misc/mediatek/aee/mrdump/mrdump_panic.c
          grep -a -q 'azixur: panic_on_oops locked to 0' out/vmlinux
          grep -a -q 'azixur: mrdump oops guard active' out/vmlinux
          grep -q '__initcall_azixur_zram_setup7' "$MAP"
          grep -E '^CONFIG_KSU|^CONFIG_MTK_COMBO_GPS|^CONFIG_MTK_FMRADIO|^CONFIG_SND_ALOOP' "$CFG"

          if [ "$FLAVOR" = "ksun" ]; then
            grep -q '^CONFIG_KSU_SYSCALL_TABLE_HOOK=y' "$CFG"
            grep -q '^# CONFIG_KSU_MANUAL_HOOK is not set' "$CFG"
            test -s out/drivers/kernelsu/hook/syscall_table_hook.o
          else
            grep -q '^CONFIG_KSU_SUSFS=y' "$CFG"
          fi

          # WiFi/Bluetooth are the critical path and must be built-in.
          grep -q ' T mtk_wcn_wmt_wifi_init$' "$MAP"
          grep -q ' T mtk_wcn_wlan_gen4_init$' "$MAP"
          grep -q ' T mtk_wcn_stpbt_drv_init$' "$MAP"

          # All panel drivers used by CPH2185/CPH2179 LK must be linked.
          # LK selects the panel at runtime from this exact list; a missing
          # driver means a black screen even though the kernel booted.
          for lcm in \
            nt36525b_hlt_yogurt_hdp_dsi_vdo_lcm \
            nt36525b_hlt_two_yogurt_hdp_dsi_vdo_lcm \
            nt36525b_txd_yogurt_hdp_dsi_vdo_lcm \
            ilt9881h_inx_yogurt_hdp_dsi_vdo_lcm \
            ilt9882n_huaxian_yogurt_hdp_dsi_vdo_lcm \
            ft8006s_txd_yogurt_hdp_dsi_vdo_lcm \
            ilt9882n_skyworth_yogurt_hdp_dsi_vdo_lcm \
            ilt9882n_txd_yogurt_hdp_dsi_vdo_lcm \
            hx83102d_hlt_psc_hdp_dsi_vdo_lcm \
            hx83102d_truly_psc_hdp_dsi_vdo_lcm \
            ilt9881h_ls_psc_hdp_dsi_vdo_lcm \
            nt36525b_hlt_psc_boe_hdp_dsi_vdo_lcm; do
            grep -q " ${lcm}_drv$" "$MAP" || {
              echo "missing LCM driver: $lcm";
              exit 1;
            }
          done

          if [ "${AZIXUR_ENABLE_GPS_FM}" = "1" ]; then
            grep -q '^CONFIG_MTK_COMBO_GPS=y' "$CFG"
            grep -q '^CONFIG_MTK_FMRADIO=y' "$CFG"
            grep -q '^CONFIG_MTK_FM_CHIP="MT6631_FM"' "$CFG"
            test -s out/drivers/misc/mediatek/connectivity/gps/gps_drv.o
            test -s out/drivers/misc/mediatek/connectivity/gps/stp_chrdev_gps.o
            test -s out/drivers/misc/mediatek/connectivity/gps/built-in.o
            test -s out/drivers/misc/mediatek/connectivity/fmradio/fmradio_drv.o
            test -s out/drivers/misc/mediatek/connectivity/fmradio/core/fm_module.o
            test -s out/drivers/misc/mediatek/connectivity/fmradio/built-in.o
            grep -q ' T mtk_wcn_stpgps_drv_init$' "$MAP"
            grep -q ' T mtk_wcn_fm_init$' "$MAP"
          else
            # Keep the weak WMT stubs, exactly like the working 31 Oct kernel.
            ! grep -q ' T mtk_wcn_stpgps_drv_init$' "$MAP"
            ! grep -q ' T mtk_wcn_fm_init$' "$MAP"
          fi

          test -n "$(find out/drivers -path '*kernelsu*' -name '*.o' -print -quit)"

      - name: Package AnyKernel zip
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp out/arch/arm64/boot/Image.gz anykernel/Image.gz
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb
          cp packaging/cph2185-anykernel.sh anykernel/anykernel.sh
          sed -i "s#^kernel.string=.*#kernel.string=azixur ${FLAVOR} Kernel (WiFi/BT) by Azizur Rahman#" \
            anykernel/anykernel.sh
          chmod +x anykernel/anykernel.sh
          grep -q '^do.devicecheck=0' anykernel/anykernel.sh
          test ! -e anykernel/dtbo.img
          rm -rf anykernel/.git
          cd anykernel
          zip -r9 "../azixur-${FLAVOR}-CPH2185-CPH2179-${GITHUB_SHA::12}.zip" . \
            -x README.md -x '*placeholder' -x '.git/*'
          cd ..
          sha256sum azixur-${FLAVOR}-CPH2185-CPH2179-*.zip

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azixur-${{ matrix.flavor }}-${{ github.sha }}
          path: |
            azixur-${{ matrix.flavor }}-CPH2185-CPH2179-*.zip
            azixur-${{ matrix.flavor }}-config
            azixur-${{ matrix.flavor }}-System.map
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download both AnyKernel zips
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: azixur-*
          merge-multiple: true

      - name: List release files
        run: ls -lh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "azixur-${{ github.run_number }}" dist/*.zip \
            --title "azixur CPH2185/CPH2179 build ${{ github.run_number }}" \
            --notes "MT6765 kernel 4.9.190-falcon-az for OPPO A15 (CPH2185) / A15s (CPH2179).

          Two flavors, flash only one:

          - **bakasu** - BakaSU KernelSU with SUSFS
          - **ksun** - KernelSU-Next legacy (syscall-table hook)

          Both include:

          - WiFi and Bluetooth built-in (restored after the 2 Nov GPS/FM regression)
          - 8 GiB zram swap enabled automatically at boot (LZ4)
          - Virtual sound: ALSA loopback, dummy card, virtual MIDI
          - ext4 unmount use-after-free fixed (the 31 Oct poweroff)
          - panic_on_oops disabled: a bad module ioctl kills only the task
          - deadline default I/O scheduler
          - NT36525B touch fix, stock OPPO DTB and DTBO section preserved
          - All CPH2185/CPH2179 LCD panel drivers compiled in (yogurt + PSC)
          - GPS/FM built-in temporarily disabled: it broke WMT/WiFi/BT init
          - AnyKernel3, kernel only: no boot.img, no vendor writes

          BakaSU users: flash the **bakasu** zip. KernelSU-Next users: flash
          the **ksun** zip. Do not flash both."
